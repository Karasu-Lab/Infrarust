name: Infrarust Deploy

on:
  push:
    branches: ["**"]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Lowercase the image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_name == 'main' }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            MC_DOMAIN=${{ vars.MC_DOMAIN }}
            MC_BACKEND_ADDRESS=${{ vars.MC_BACKEND_ADDRESS }}
            MC_AUTH_DOMAIN=${{ vars.MC_AUTH_DOMAIN }}
            MC_AUTH_SRV_TARGET=${{ vars.MC_AUTH_SRV_TARGET }}
            MC_AUTH_BACKEND_ADDRESS=${{ vars.MC_AUTH_BACKEND_ADDRESS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.ref_name == 'main'
    needs: build
    environment: production
    runs-on: ubuntu-latest
    env:
      COOLIFY_HOST: ${{ vars.COOLIFY_HOST }}
      COOLIFY_APPLICATION_UUID: ${{ vars.COOLIFY_APPLICATION_UUID }}
      CI_DEPLOY_TOKEN: ${{ secrets.CI_DEPLOY_TOKEN }}
    steps:
      - name: Deploy to Coolify
        run: |
          status=$(curl --silent --show-error --location --request POST --output response.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CI_DEPLOY_TOKEN}" \
            --header "Accept: application/json" \
            "${COOLIFY_HOST%/}/api/v1/deploy?uuid=${COOLIFY_APPLICATION_UUID}&force=true")
          cat response.json
          test "$status" -lt 400
